<script>/* 🌐 Cozy Town on the open web: play together through Firebase (never used inside Claude) */
(function(){
  const CFG={"databaseURL": "https://cozy-town-264d2-default-rtdb.europe-west1.firebasedatabase.app"},CODE='cozy-town';
  function rid(){const a=new Uint8Array(10);crypto.getRandomValues(a);return'p'+Array.from(a,b=>(b%36).toString(36)).join('');}
  function clean(o){return JSON.parse(JSON.stringify(o,(k,v)=>typeof v==='number'&&!isFinite(v)?null:v));}
  let dbP=null;
  function getDb(){if(!dbP)dbP=new Promise((ok,no)=>{try{const fb=window.firebase;if(!fb||!fb.database)throw new Error('no firebase');const app=fb.apps&&fb.apps.length?fb.app():fb.initializeApp(CFG);ok(fb.database(app));}catch(e){dbP=null;no(e);}});return dbP;}
  const inClaude=!!(window.claude&&typeof window.claude.use==='function');
  window.WEBNET={on:!!CFG&&!inClaude};
  window.WEBROOM=(CFG&&!inClaude)?async()=>{const db=await getDb();return{join:async w=>group(db,w)};}:null;
  function group(db,world){
    const fb=window.firebase,TS=fb.database.ServerValue.TIMESTAMP,me=rid();
    const base=db.ref('worlds/'+CODE+'/'+String(world).replace(/[.#$\[\]\/]/g,'_')+'/peers'),mine=base.child(me);
    let pres={},cb=null,lost=null,prev=new Set(),off=0,vals={},dead=false;
    const offRef=db.ref('.info/serverTimeOffset'),conRef=db.ref('.info/connected');
    const onOff=s=>{off=+s.val()||0;};offRef.on('value',onOff);
    let sent=null;
    /* first time (and after a reconnect) send everything; after that only what changed, so a big house layout isn't re-sent on every step */
    const full=()=>{if(!Object.keys(pres).length)return Promise.resolve();const c=clean(pres);sent=JSON.parse(JSON.stringify(c));return mine.set(Object.assign(c,{t:TS}));};
    const put=()=>{if(!sent)return full();const c=clean(pres),d={};let n=0;
      for(const k in c){if(JSON.stringify(c[k])!==JSON.stringify(sent[k])){d[k]=c[k];n++;}}
      for(const k in sent)if(!(k in c)){d[k]=null;n++;}
      if(!n)return Promise.resolve();sent=JSON.parse(JSON.stringify(c));d.t=TS;return mine.update(d);};
    const onCon=s=>{if(s.val()===true&&!dead){mine.onDisconnect().remove();full().catch(()=>{});}};conRef.on('value',onCon);
    const emit=()=>{if(!cb||dead)return;const now=Date.now()+off,peers=[],ids=new Set();
      for(const id in vals){const v=vals[id];if(!v||typeof v!=='object')continue;if(id!==me&&Number.isFinite(v.t)&&now-v.t>75000)continue;ids.add(id);peers.push({peer:id,presence:v,isMe:id===me,sameTab:id===me});}
      const left=[];for(const id of prev)if(!ids.has(id))left.push({peer:id});prev=ids;try{cb({peers,left});}catch(e){console.warn(e);}};
    const onVal=s=>{vals=s.val()||{};emit();};
    base.on('value',onVal,()=>{if(!dead&&lost){dead=true;lost();}});
    const hb=setInterval(()=>{if(dead)return;if(Object.keys(pres).length)mine.update({t:TS}).catch(()=>{});emit();},20000);
    const bye=()=>{try{mine.remove();}catch(e){}};addEventListener('pagehide',bye);
    return{onPeers(f,l){cb=f;lost=l;setTimeout(emit,0);return()=>{dead=true;cb=null;clearInterval(hb);base.off('value',onVal);conRef.off('value',onCon);offRef.off('value',onOff);removeEventListener('pagehide',bye);bye();};},
      presence(st){Object.assign(pres,st);return put();}};}
})();
</script>
