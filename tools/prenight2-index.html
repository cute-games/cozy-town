<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cozy Town</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cozy Town">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffd6e6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brown:#8a4b1f;--ink:#3d2c5e;--paper:#fff7fb;--paper2:#f3e9ff;--line:#3d2c5e;--soft:rgba(61,44,94,.28);
  --pink:#ff7aa8;--mint:#5fd4b0;--butter:#ffd45c;--sky:#7cc8ff;--lilac:#b79cff;--coral:#ff8a6b;
  --font:"Baloo 2","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brown:#ffc58f;--ink:#fff1f8;--paper:#2f2552;--paper2:#3d3169;--line:#140e28;--soft:rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--brown:#ffc58f;--ink:#fff1f8;--paper:#2f2552;--paper2:#3d3169;--line:#140e28;--soft:rgba(0,0,0,.45);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;overflow:hidden;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:#8fd3ff;color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#touch{position:fixed;inset:0;z-index:1;touch-action:none}
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.btn{font:800 20px/1.05 var(--font);color:#3d2c5e;background:var(--pink);border:3px solid #3d2c5e;border-radius:18px;padding:10px 16px;min-height:52px;box-shadow:0 5px 0 #3d2c5e;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:8px;pointer-events:auto;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3d2c5e}
.btn:focus-visible,.it:focus-visible,.sw:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.btn[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:0 5px 0 #3d2c5e}
.btn.mint{background:var(--mint)}.btn.butter{background:var(--butter)}.btn.sky{background:var(--sky)}.btn.lilac{background:var(--lilac)}.btn.white{background:#fff}.btn.coral{background:var(--coral)}
.ib{width:56px;height:56px;min-height:0;padding:0;border-radius:50%;font-size:26px}
#left{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);display:flex;flex-direction:column;gap:10px;align-items:flex-start;max-width:calc(100% - 210px)}
#stats{display:flex;flex-wrap:wrap;gap:8px;max-width:100%}/* the chips stay in the left column: a long day label never pushes the tummy chip under the top buttons */
.chip{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 14px 0 10px;background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:999px;box-shadow:0 4px 0 var(--soft);font-weight:800;font-size:19px;white-space:nowrap}
.chip .e{font-size:21px;line-height:1}
.bar{display:inline-block;width:62px;height:13px;border-radius:99px;background:var(--paper2);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--mint);transition:width .4s}
.bar i.low{background:var(--coral)}
.day{font-weight:600;font-size:15px;opacity:.8}
#tasks{pointer-events:auto;background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--soft);padding:6px 14px 8px;max-width:min(330px,100%);font-size:16px;line-height:1.3;cursor:pointer}
#tasks h3{margin:0 0 2px;font-size:17px;font-weight:800}
#tasks ul{margin:0;padding:0;list-style:none}
#tasks li{display:flex;gap:7px;padding:1px 0;font-weight:600}
#tasks li::before{content:"";flex:0 0 14px;height:14px;margin-top:4px;border:2.5px solid var(--line);border-radius:5px;background:var(--paper2)}
#tasks.min ul{display:none}
#topbtns{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:10px}
#cross{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;border:2px solid #3d2c5e;opacity:.85}
#cross.big{width:28px;height:28px;margin:-14px 0 0 -14px;background:transparent;border:3px solid #fff;box-shadow:0 0 0 2px #3d2c5e,inset 0 0 0 2px #3d2c5e;opacity:1}
#joy{position:absolute;left:calc(env(safe-area-inset-left,0px) + 30px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.3);border:3px solid rgba(61,44,94,.45);opacity:.6;transition:opacity .2s}
#joy.on{opacity:1;transition:none}
#knob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:#fff;border:3px solid #3d2c5e;box-shadow:0 4px 0 rgba(61,44,94,.35)}
#moveBtns{position:absolute;right:calc(env(safe-area-inset-right,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;align-items:flex-end;gap:14px}
#bJump{width:88px;height:88px;min-height:0;border-radius:50%;padding:0;font-size:38px}
#bRun{width:72px;height:72px;min-height:0;border-radius:50%;padding:0;font-size:32px;background:#fff}
#bRun.on{background:var(--sky)}
#swMeter{position:relative;width:26px;height:84px;border-radius:14px;background:#fff;border:3px solid #3d2c5e;overflow:hidden;box-shadow:0 5px 0 #3d2c5e;margin-bottom:6px}
#swMeter[hidden]{display:none}
#swFill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,#5fd4b0,#ffd45c 55%,#ff7aa8)}
#swMeter.full{animation:swGlow .5s ease-in-out infinite alternate}
@keyframes swGlow{from{box-shadow:0 5px 0 #3d2c5e,0 0 0 0 rgba(255,212,92,.9)}to{box-shadow:0 5px 0 #3d2c5e,0 0 0 8px rgba(255,212,92,.55)}}
.swinging #bRun{display:none}
.swinging #actWrap{bottom:calc(env(safe-area-inset-bottom,0px) + 178px)}
.swinging #bJump{position:relative}
.swinging #bJump::after{content:'Higher!';position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#fff;border:3px solid #3d2c5e;border-radius:12px;padding:3px 10px;font-size:16px;font-weight:800;color:#3d2c5e;white-space:nowrap;pointer-events:none}
#bJump.pump{animation:pumpPop .22s ease-out}
@keyframes pumpPop{0%{transform:scale(.86)}100%{transform:scale(1)}}
#actWrap{position:absolute;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 136px);display:flex;flex-direction:column;align-items:center;gap:10px}
#actLbl{background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:999px;padding:3px 14px;font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--soft);white-space:nowrap;max-width:min(46vw,300px);overflow:hidden;text-overflow:ellipsis}
#act{width:100px;height:100px;border-radius:50%;padding:0;font-size:46px;background:var(--butter)}
#bar{position:absolute;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;flex-direction:column;align-items:stretch;gap:12px;width:min(220px,44vw)}
#bar .btn{justify-content:flex-start;white-space:nowrap}
#bar .brow{display:flex;gap:8px}#bar .brow .btn{flex:1 1 0;min-width:0;justify-content:center;padding-left:4px;padding-right:4px;font-size:16px}
#bar .btn.sm{align-self:flex-end;padding-top:8px;padding-bottom:8px}
.btn.dsPulse{animation:dsPulse 1.3s ease-in-out infinite}
@keyframes dsPulse{0%,100%{transform:scale(1);box-shadow:0 4px 0 rgba(61,44,94,.3),0 0 0 0 rgba(255,212,92,.9)}50%{transform:scale(1.06);box-shadow:0 4px 0 rgba(61,44,94,.3),0 0 0 10px rgba(255,212,92,0)}}
@media (max-width:600px){#bar{gap:9px}#bar .btn{font-size:16px;padding:10px 10px}#bar .brow .btn{font-size:14px;padding:10px 4px}#bar .btn.sm{font-size:14px;padding:7px 12px}}
#toast{position:fixed;z-index:30;pointer-events:none;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 200px);transform:translate(-50%,12px);opacity:0;transition:opacity .2s,transform .2s;background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:18px;box-shadow:0 4px 0 var(--soft);padding:8px 16px;font-weight:700;font-size:19px;max-width:min(520px,calc(100vw - 32px));text-align:center;width:max-content}
#toast.show{opacity:1;transform:translate(-50%,0)}
#panel{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 14px) calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 14px);background:rgba(46,35,71,.3)}
#panel.bottom{align-items:flex-end;background:transparent}
.card{position:relative;width:min(620px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:26px;box-shadow:0 8px 0 var(--soft);padding:18px 18px 22px}
#panel.bottom .card{overflow:visible;margin-bottom:8px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd h2{margin:0;font-size:30px;font-weight:800;line-height:1;flex:1}
.x{flex:0 0 auto;width:46px;height:46px;min-height:0;padding:0;border-radius:50%;font-size:22px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:12px}
.it{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px 8px;background:var(--paper2);color:var(--ink);border:3px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--soft);cursor:pointer;font:700 16px/1.2 var(--font);touch-action:manipulation}
.it:active{transform:translateY(3px);box-shadow:0 1px 0 var(--soft)}
.it .em{font-size:42px;line-height:1.15}
.it .pr{font-weight:800}
.it .have{font-size:13px;opacity:.75;min-height:16px}
.sec{margin:18px 0 8px;font-size:21px;font-weight:800}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.who{position:absolute;top:-22px;left:22px;background:var(--c,#ff9ec4);color:#3d2c5e;border:3px solid #3d2c5e;border-radius:14px;padding:1px 16px;font-weight:800;font-size:22px;box-shadow:0 4px 0 #3d2c5e;transform:rotate(-3deg)}
.hearts{position:absolute;top:10px;right:18px;font-size:21px;letter-spacing:2px;color:var(--pink)}
.hearts .off{color:var(--ink);opacity:.25}
.line{font-size:22px;line-height:1.35;margin:14px 0 4px;font-weight:600;max-width:60ch}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid #3d2c5e;cursor:pointer;box-shadow:0 3px 0 var(--soft);padding:0}
.sw.on{outline:4px solid var(--ink);outline-offset:3px}
.swrow{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 4px}
.inp{font:700 22px var(--font);color:#3d2c5e;background:#fff;border:3px solid #3d2c5e;border-radius:14px;padding:8px 14px;width:100%;outline:none;-webkit-user-select:text;user-select:text}
.inp:focus{box-shadow:0 0 0 3px var(--sky)}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs .btn{min-height:44px;font-size:18px;padding:6px 14px}
.tabs .btn.on{background:var(--butter)}
.tabs .btn.off{background:#fff}
.note{font-size:17px;opacity:.85;margin:6px 0 0;font-weight:600}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px dashed var(--soft);font-size:20px;font-weight:700}
#panel.side{justify-content:flex-end;background:transparent;touch-action:none}
#panel.side .card{width:min(540px,58vw);touch-action:pan-y}
@media (orientation:portrait){#panel.side{justify-content:center;align-items:flex-end}#panel.side .card{width:100%;max-height:58%}}
.crname{font-size:26px;text-align:center;margin-bottom:4px}
.crhint{color:var(--coral);text-align:center;margin:2px 0 4px}
.crow{display:grid;grid-template-columns:112px 1fr;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--soft)}
.cl{font-weight:800;font-size:18px;line-height:1.1;color:var(--brown)}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:800 16px/1 var(--font);color:#3d2c5e;background:#fff;border:3px solid #3d2c5e;border-radius:999px;padding:8px 13px;min-height:40px;box-shadow:0 3px 0 #3d2c5e;cursor:pointer;touch-action:manipulation}
.pill.on{background:var(--butter)}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 #3d2c5e}
.pill:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.crow .sw{width:42px;height:42px}
.crgo{flex:1}
#bPhone{position:relative}
.badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:#ff4d6d;color:#fff;border:3px solid #3d2c5e;font:800 13px/18px var(--font);text-align:center}
.card.phonecard{background:transparent;border:0;box-shadow:none;padding:0;width:auto;overflow:visible}
.phone{width:min(360px,92vw);height:min(680px,86vh);height:min(680px,86dvh);background:#3d2c5e;border-radius:44px;padding:12px 12px 14px;box-shadow:0 10px 0 rgba(20,12,40,.35);display:flex;flex-direction:column;gap:8px;animation:phup .28s cubic-bezier(.2,1.3,.5,1)}
@keyframes phup{from{transform:translateY(40px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.phone{animation:none}}
.ph-status{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800;font-size:15px;padding:2px 16px 0}
.ph-screen{flex:1;min-height:0;border-radius:30px;overflow:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(165deg,#ffd6ec,#e3e2ff 55%,#c9f2e3);padding:14px 14px 18px;color:#3d2c5e}
.ph-home{align-self:center;width:130px;height:10px;min-height:0;padding:0;border-radius:99px;background:rgba(255,255,255,.6);border:0;cursor:pointer}
.ph-clock{text-align:center;font-weight:800;font-size:58px;line-height:1;margin-top:18px;color:#3d2c5e}
.ph-date{text-align:center;font-weight:700;font-size:17px;opacity:.8;margin-bottom:6px}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 8px;margin-top:26px}
.app{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;font:800 16px var(--font);color:#3d2c5e;cursor:pointer;padding:0;touch-action:manipulation}
.app .ic{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;font-size:40px;border:3px solid #3d2c5e;box-shadow:0 4px 0 #3d2c5e}
.app:active .ic{transform:translateY(3px);box-shadow:0 1px 0 #3d2c5e}
.app .badge{top:-8px;right:4px}
.ph-hd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ph-hd h3{margin:0;font-size:26px;font-weight:800;flex:1;line-height:1}
.ph-back{width:42px;height:42px;min-height:0;padding:0;border-radius:50%;font-size:22px;background:#fff}
.ph-coins{background:#fff;border:3px solid #3d2c5e;border-radius:99px;padding:2px 10px;font-weight:800;font-size:16px}
.ph-sub{margin:2px 0 6px;font-weight:600;font-size:15px;opacity:.85}
.qcard{background:#fff;border:3px solid #3d2c5e;border-radius:18px;padding:10px 12px;margin-top:10px;box-shadow:0 3px 0 rgba(61,44,94,.25)}
.qtop{display:flex;gap:10px;align-items:center}
.qi{font-size:34px;line-height:1}
.qt{font-weight:800;font-size:18px;line-height:1.1}
.qd{font-weight:600;font-size:15px;opacity:.85;line-height:1.2}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.qr{font-weight:800;font-size:17px}
.qbtn{min-height:42px;font-size:17px;padding:6px 14px}
.qprog{flex:1;max-width:150px;height:16px;border-radius:99px;border:2.5px solid #3d2c5e;background:#f3e9ff;overflow:hidden;position:relative}
.qprog i{display:block;height:100%;background:#5fd4b0}
.qn{font-weight:800;font-size:15px;min-width:52px;text-align:right}
.qdone{font-weight:800;color:#2f9a77}
.ph-tabs{display:flex;gap:8px;margin:6px 0 4px}
.qcard.hard{border-color:#e8573a;background:#fff6f1;box-shadow:0 3px 0 rgba(232,87,58,.3)}
.qtag{display:inline-block;margin-left:6px;padding:0 8px;border-radius:99px;background:#ff8a6b;color:#fff;font-size:12px;font-weight:800;vertical-align:middle}
.qtag.tricky{background:#9b7cf0}
.qsteps{list-style:none;margin:8px 0 0;padding:0;font-weight:700;font-size:15px;line-height:1.4}
.qsteps li.ok{color:#2f9a77}
.sklv{font-weight:700;font-size:15px;text-align:center;line-height:1;background:#ffd45c;border:3px solid #3d2c5e;border-radius:14px;padding:5px 8px;flex:0 0 auto}
.sklv b{display:block;font-size:24px;font-weight:800;margin-top:2px}
.rc{background:var(--paper2);color:var(--ink);border:3px solid var(--line);border-radius:18px;padding:10px 12px;margin-top:10px}
.ing{display:inline-block;background:var(--paper);border:2px solid var(--soft);border-radius:99px;padding:0 8px;margin:3px 3px 0 0;font-size:14px;font-weight:700}
.ing.ok{border-color:#2f9a77;color:#2f9a77}
#nav{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border:3px solid var(--line);border-radius:999px;box-shadow:0 4px 0 var(--soft);padding:3px 4px 3px 12px;font-weight:800;font-size:18px;max-width:100%}
#navArrow{display:inline-block;font-size:24px;transition:transform .15s}
#nav .x{width:44px;height:44px;font-size:16px;box-shadow:0 2px 0 #3d2c5e}
.mapwrap{position:relative;margin-top:6px}
#mapc{width:100%;display:block;border-radius:16px;border:3px solid #3d2c5e;background:#9fe486;touch-action:none}
.places{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.place{display:flex;align-items:center;gap:6px;background:#fff;border:2.5px solid #3d2c5e;border-radius:12px;padding:5px 8px;font:800 14px var(--font);color:#3d2c5e;cursor:pointer;text-align:left;touch-action:manipulation}
.place .pi{font-size:20px}
.crsave{position:sticky;bottom:-18px;z-index:2;background:var(--paper);margin:10px -18px -18px;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:3px dashed var(--soft);justify-content:center}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #3d2c5e;vertical-align:-2px;margin-left:2px}
.codecard{background:linear-gradient(160deg,#fff6c9,#ffd6ea);border:3px solid #3d2c5e;border-radius:22px;box-shadow:0 5px 0 #3d2c5e;padding:14px 12px 16px;margin:10px 4px 14px;text-align:center;color:#3d2c5e}
.cc-top{font:800 14px var(--font);letter-spacing:.5px;opacity:.8}
.cc-face{width:64px;height:64px;margin:8px auto 4px;border-radius:50%;background:#ff9ec4;border:3px solid #3d2c5e;display:grid;place-items:center;font-size:36px;line-height:1}
.cc-nm{font:800 22px var(--font)}
.cc-lbl{font:800 13px var(--font);margin-top:10px;opacity:.75;text-transform:uppercase;letter-spacing:1px}
.cc-code{font:800 32px var(--font);letter-spacing:3px;background:#fff;border:3px dashed #3d2c5e;border-radius:14px;padding:8px 6px;margin-top:4px;word-break:break-all}
.btn.pink{background:#ff9ec4}

function lakeOut(x,z,r,c){const dx=x-c.cx,dz=z-c.cz,m=r+c.cr;if(Math.abs(dx)>m||Math.abs(dz)>m)return null;const d=Math.hypot(dx,dz);if(d>=m)return null;

    const tc=clamp(t,0,w.len),sc=clamp(s,-h,h),px=w.ax+w.ux*tc-w.uz*sc,pz=w.az+w.uz*tc+w.ux*sc,k=Math.hypot(px-x,pz-z);if(k<bc){bc=k;best=[px,pz];}}

  return best;}
function pushOut(x,z,r,c){

  if(c.cr!==undefined){const dx=x-c.cx,dz=z-c.cz,m=r+c.cr;if(Math.abs(dx)>m||Math.abs(dz)>m)return null;const d=Math.hypot(dx,dz);if(d>=m)return null;if(d<1e-6)return[x+m,z];const k=(m-d)/d;return[x+dx*k,z+dz*k];}
  if(x<c.x1-r||x>c.x2+r||z<c.z1-r||z>c.z2+r)return null;
  const px=clamp(x,c.x1,c.x2),pz=clamp(z,c.z1,c.z2),dx=x-px,dz=z-pz,d2=dx*dx+dz*dz;
  if(d2>=r*r)return null;
  if(d2>1e-9){const d=Math.sqrt(d2),k=(r-d)/d;return[x+dx*k,z+dz*k];}
  const l=x-c.x1,rr2=c.x2-x,t=z-c.z1,b=c.z2-z,m=Math.min(l,rr2,t,b);

function collideXZ(x,z,r,L,extra){

function knock(id){if(id&&dlCarrying()){deliverKnock(id);return;}if(id&&dsGoing(id)){enterClient();return;}SFX.knock();toast(pick(["Knock knock… nobody's home right now.","Knock knock… someone's playing music inside! 🎶","Knock knock… you hear a dog bark hello. 🐶","Knock knock… “Just a minute!” Someone is baking cookies! 🍪"]));}
const MAXLV=10,xpNeed=lv=>10*lv;
function sk(k){S.skills=S.skills||{};return S.skills[k]||(S.skills[k]={lv:1,xp:0});}
function addXP(k,n){if(!S||!SKILLS[k])return;const s=sk(k);if(s.lv>=MAXLV)return;s.xp+=n;let up=false;
  while(s.lv<MAXLV&&s.xp>=xpNeed(s.lv)){s.xp-=xpNeed(s.lv);s.lv++;up=true;}if(s.lv>=MAXLV)s.xp=0;
  if(up){const r=10*s.lv;S.coins+=r;SFX.yay();setTimeout(()=>toast(SKILLS[k].i+' '+SKILLS[k].n+' level '+s.lv+'! +'+r+' 🪙',3.6),300);floatText('⭐',P.x-Math.sin(P.yaw)*1.4,1.9,P.z-Math.cos(P.yaw)*1.4,{h:.6});change();}}
function bumpLevel(k,n=1){if(!S||!SKILLS[k])return;const s=sk(k);for(let i=0;i<n&&s.lv<MAXLV;i++){s.lv++;const r=10*s.lv;S.coins+=r;}
  s.xp=0;if(s.lv>=MAXLV)s.xp=0;SFX.yay();setTimeout(()=>toast(SKILLS[k].i+' '+SKILLS[k].n+' is now level '+s.lv+'! ⭐',3.6),300);
  floatText('⭐',P.x-Math.sin(P.yaw)*1.4,1.9,P.z-Math.cos(P.yaw)*1.4,{h:.6});change();}
const CD={};function cool(k,s){const t=performance.now();if(CD[k]&&t-CD[k]<s*1000)return false;CD[k]=t;return true;}
/* ---- your backyard garden ---- */
const PLOTS=[];let PLANT=null;
function plotStage(st){if(!st||!st.seed)return -1;if(st.g>=1)return 3;if(st.g>=.5)return 2;if(st.g>=.12)return 1;return 0;}
function gardenInit(){S.garden=S.garden||[];for(let i=0;i<6;i++)S.garden[i]=S.garden[i]||{};
  if(!PLOTS.length){const L=LOC.city;for(const pl of L.plots){const soilM=toon({color:'#7a5236'});const soil=new THREE.Mesh(new THREE.BoxGeometry(1.6,.05,1.0),soilM);soil.position.set(pl.x,.15,pl.z);soil.receiveShadow=true;L.dyn.add(soil);
    const grp=new THREE.Group();grp.position.set(pl.x,.175,pl.z);L.dyn.add(grp);const rec={pl,soil,soilM,grp,key:'',icon:null,iconK:''};
    rec.target={x:pl.x,z:pl.z,r:1.6,rect:{x1:pl.x-.92,z1:pl.z-.62,x2:pl.x+.92,z2:pl.z+.62},obj:grp,icon:'🌱',label:()=>plotLabel(rec),act:()=>usePlot(rec)};L.inter.push(rec.target);PLOTS.push(rec);}}
  for(const r of PLOTS)plotRefresh(r);}
function plotLabel(rec){const st=S.garden[rec.pl.i];if(!st.seed)return'Plant seeds';const K=SEEDS[st.seed];if(st.g>=1)return'Pick your '+K.pl;if(st.w!==S.day)return'Water your '+K.pl;return K.n+' growing… '+Math.floor(st.g*100)+'%';}
function buildCrop(g,seed,sg){const o={ol:.012},spots=[[-.5,-.24],[0,-.24],[.5,-.24],[-.5,.24],[0,.24],[.5,.24]],G='#5fbf74',G2='#4fae64';
  if(sg===0){for(const [x,z] of spots)sph(g,.06,'#5a3a24',x,.0,z,{s:[1,.5,1],ws:6,hs:5,ol:false});return;}
  if(sg===1){for(const [x,z] of spots){cone(g,.05,.14,G,x,0,z,{seg:5,...o});}return;}
  if(seed==='pumpkin'){for(const [x,z] of [[-.55,-.2],[.5,.25],[-.2,.3],[.35,-.3]])sph(g,.16,G,x,.05,z,{s:[1,.45,1],ws:10,hs:6,...o});
    if(sg===3){sph(g,.32,'#ff9a3c',0,.24,0,{s:[1.1,.78,1],ws:14,hs:10,ol:.02});for(let k=0;k<6;k++){const a=k/6*Math.PI;box(g,.02,.4,.68,'#e8822a',0,.07,0,{ry:a,ol:false});}cyl(g,.03,.035,.14,G2,0,.45,0,{seg:6,...o});}return;}
  if(seed==='sunflower'){for(const x of[-.5,0,.5]){const h=sg===3?1.0:.55;cyl(g,.025,.025,h,G2,x,0,0,{seg:5,...o});sph(g,.09,G,x+.08,h*.5,0,{s:[1,.4,.6],ws:8,hs:6,...o});
      if(sg===3){const hd=new THREE.Group();hd.position.set(x,h+.05,.03);hd.rotation.x=-.25;g.add(hd);for(let k=0;k<9;k++){const a=k/9*TAU;box(hd,.07,.14,.025,'#ffd45c',Math.cos(a)*.12,Math.sin(a)*.12,0,{rz:a-Math.PI/2,center:true,ol:.01});}cyl(hd,.09,.09,.04,'#8c6137',0,0,.015,{rx:Math.PI/2,center:true,seg:12,ol:.01});}}return;}
  for(const [x,z] of spots){
    if(seed==='carrot'){for(let k=0;k<3;k++)cone(g,.035,sg===3?.3:.2,G,x+(k-1)*.05,0,z,{seg:5,rz:(k-1)*.3,...o});if(sg===3)cone(g,.055,.1,'#ff8a2b',x,-.04,z,{rx:Math.PI,seg:8,...o});}
    else if(seed==='tomato'){sph(g,sg===3?.19:.14,G,x,.15,z,{ws:10,hs:8,...o});if(sg===3)for(const [dx,dy,dz] of [[.12,.2,.08],[-.1,.12,.12],[.05,.3,-.1],[-.12,.25,-.06]])sph(g,.05,'#ff4d4d',x+dx,dy,z+dz,{ws:8,hs:6,ol:.01});}
    else if(seed==='strawberry'){for(let k=0;k<3;k++){const a=k/3*TAU;sph(g,.08,G,x+Math.cos(a)*.07,.03,z+Math.sin(a)*.07,{s:[1,.45,1],ws:8,hs:6,...o});}if(sg===3){sph(g,.045,'#ff4d6d',x+.08,.04,z+.06,{s:[1,1.2,1],ws:8,hs:6,ol:.01});sph(g,.045,'#ff4d6d',x-.07,.04,z-.05,{s:[1,1.2,1],ws:8,hs:6,ol:.01});sph(g,.025,'#ffffff',x,.08,z,{ws:6,hs:5,ol:false});}}
    else if(seed==='tulip'){box(g,.03,.2,.07,G,x-.04,0,z,{rz:.2,...o});box(g,.03,.2,.07,G,x+.04,0,z,{rz:-.2,...o});if(sg===3){cyl(g,.012,.012,.3,G2,x,0,z,{seg:4,ol:false});cone(g,.06,.12,pick(['#ff7aa8','#ffd45c','#ff8a6b','#b79cff']),x,.3,z,{rx:Math.PI,seg:6,ol:.01});}}
  }}
function plotRefresh(rec){const st=S.garden[rec.pl.i]||{};rec.soilM.color.set(st.seed&&st.w===S.day?'#4a3020':'#7a5236');
  const sg=plotStage(st),key=sg+':'+(st.seed||'');
  if(key!==rec.key){rec.key=key;while(rec.grp.children.length){const c=rec.grp.children[0];rec.grp.remove(c);c.traverse(o=>{if(o.geometry)o.geometry.dispose();});}if(sg>=0)buildCrop(rec.grp,st.seed,sg);rec.grp.traverse(o=>{if(o.isMesh&&o.material.side!==THREE.BackSide)o.castShadow=true;});}
  const need=!st.seed?'':st.g>=1?'✨':st.w!==S.day?'💧':'';
  if(need!==rec.iconK){rec.iconK=need;if(rec.icon){LOC.city.dyn.remove(rec.icon);rec.icon=null;}if(need){const s=label(need,.42,{bg:null,bw:0,pad:4});s.position.set(rec.pl.x,1.25,rec.pl.z);LOC.city.dyn.add(s);rec.icon=s;}}
  rec.target.icon=!st.seed?'🌱':st.g>=1?'🧺':st.w!==S.day?'💧':'🌿';}
function usePlot(rec){const st=S.garden[rec.pl.i];
  if(!st.seed){const have=Object.keys(SEEDS).filter(k=>S.bag['seed_'+k]>0);if(!have.length){SFX.no();toast('You need seeds! Buy some at the seed box by the shed. 🌱',3.2);return;}
    PLANT=rec;openPanel(`<div class="hd"><h2>🌱 Plant seeds</h2><button class="btn x" data-a="close" aria-label="Close">✕</button></div><p class="note">What do you want to grow?</p><div class="grid" style="margin-top:8px">${have.map(k=>`<button class="it" data-a="plant:${k}"><span class="em">${SEEDS[k].i}</span><span>${SEEDS[k].n}</span><span class="have">×${S.bag['seed_'+k]}</span></button>`).join('')}</div>`);return;}
  if(st.g>=1)return harvest(rec);
  if(st.w!==S.day){st.w=S.day;SFX.splash();for(let i=0;i<4;i++)setTimeout(()=>floatText('💧',rec.pl.x+rand(-.6,.6),.7,rec.pl.z+rand(-.3,.3),{h:.4}),i*120);toast('Glug glug! Now your plants can grow. 💧',2.6);addXP('garden',3);qEvent('water');qEvent('waterplot');plotRefresh(rec);change();return;}
  toast(SEEDS[st.seed].i+' Growing… '+Math.floor(st.g*100)+'%. Come back a bit later!',2.6);}
function plantSeed(k){const rec=PLANT;if(!rec||!S.bag['seed_'+k])return;S.bag['seed_'+k]--;S.garden[rec.pl.i]={seed:k,g:0,w:0};PLANT=null;closePanel();SFX.pop();qEvent('plant:'+k);
  toast('You planted '+SEEDS[k].n.toLowerCase()+' seeds! Now give them water. 💧',3);addXP('garden',2);qEvent('plant');plotRefresh(rec);change();}
function harvest(rec){const st=S.garden[rec.pl.i],K=SEEDS[st.seed];qEvent('harvest:'+st.seed);
  if(K.furn){S.home.store.push({u:uid(),t:K.furn,c:FURN[K.furn].cols?pick(FURN[K.furn].cols):null,x:0,z:0,r:0});toast(K.i+' You picked '+K.pl+'! A pot of them is waiting in 📦 My stuff at home.',3.6);}
  else{const [id,n]=K.yield;S.bag[id]=(S.bag[id]||0)+n;toast('🧺 You picked '+(n>1?n+' '+K.pl:'a '+K.pl)+'! '+K.i+' They\'re in your bag.',3.4);}
  S.garden[rec.pl.i]={};SFX.yay();floatText(K.i,rec.pl.x,1.1,rec.pl.z,{h:.6});addXP('garden',5);qEvent('harvest');plotRefresh(rec);change();}
function updGarden(dt){if(!S||!S.garden||!PLOTS.length)return;for(const rec of PLOTS){const st=S.garden[rec.pl.i];if(!st||!st.seed||st.g>=1||st.w!==S.day)continue;
  const before=plotStage(st);st.g=Math.min(1,st.g+dt/HOUR/SEEDS[st.seed].h);
  if(st.g>=1){toast('🧺 Your '+SEEDS[st.seed].rd+' ready to pick!',3.4);SFX.yay();change();}
  if(plotStage(st)!==before)plotRefresh(rec);}}
function waterBed(b){S.water=S.water||{};if(S.water[b.id]===S.day){toast('These flowers already had water today. 🌼');return;}S.water[b.id]=S.day;SFX.splash();
  for(let i=0;i<4;i++)setTimeout(()=>floatText('💧',b.x+rand(-.6,.6),.8,b.z+rand(-.3,.3),{h:.42}),i*130);toast('The flowers look so happy! 🌸',2.4);addXP('garden',5);qEvent('water');change();}

/* 🕰️ one clock for everyone: my clock rides along in presence as ck:[day,hour], refreshed only after 5 game minutes
   (or a new day), so standing still sends little. A friend ahead by 2+ game minutes pulls my clock forward, never back.
   A brand-new player first finishes Rosie's welcome in the morning, then joins the friends' time */
function mpClock(){const c=MP.ck;if(!c||c[0]!==S.day||Math.abs(S.time-c[1])>=1/12)MP.ck=[S.day,Math.floor(S.time*100)/100];return MP.ck;}
function clockFrom(a,ck){if(!Array.isArray(ck)||!S.intro)return;const k=ck.join(',');if(k===a.clk)return;a.clk=k;   /* old versions send no ck */
  const d=ck[0],h=ck[1];if(!Number.isInteger(d)||d<1||d>=1e5||!Number.isFinite(h)||h<0||h>=24)return;
  const ahead=(d-S.day)*24+h-S.time;if(ahead<1/30)return;
  if(ahead<1){const nd=d!==S.day;S.day=d;S.time=h;if(nd){newDay();change();}return;}   /* a small catch-up is quiet, like a normal midnight */
  const T=MP.ckTo;if(!T||(d-T[0])*24+h-T[1]>0)MP.ckTo=[d,h];if(!T)setTimeout(clockJump,400);}
/* a big jump (1 game hour or more) waits until no message, tips or class is on screen, so it never cuts a hello or a tip
   (and the new-day messages come after it), then fades like the bed and tells the time */
function clockJump(n=0){if(!MP.ckTo||!S||!PLAYING){MP.ckTo=null;return;}
  if(n<300&&($('toast').classList.contains('show')||fading||TUT||DTUT||CUT)){setTimeout(()=>clockJump(n+1),400);return;}
  fade(()=>{const T=MP.ckTo;MP.ckTo=null;if(!T||!S)return;const ahead=(T[0]-S.day)*24+T[1]-S.time;if(ahead<1/30)return;
    const nd=T[0]!==S.day;S.day=T[0];S.time=T[1];if(nd){newDay();change();}
    if(ahead>=1)toast('🕰️ Same time as your friends: '+wdName()+', day '+S.day+' · '+clockStr(S.time),3.4);});}

function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h;}
function laneMe(){return MP.me||'me';}
/* every player (you too) gets a lot, picked from their name; whoever joined first keeps a lot if two names want the same one */
function laneAssign(){const list=[{k:laneMe(),nm:cleanName(S.name||'Friend'),jt:MP.jt||0,big:!!S.bighouse}];
  for(const a of MP.peers.values())list.push({k:a.peer,nm:a.nm,jt:Number.isFinite(a.jt)?a.jt:9e15,big:!!a.bh});
  list.sort((a,b)=>a.jt-b.jt||(a.k<b.k?-1:a.k>b.k?1:0));

  for(const p of list){let j=hashStr(p.nm.toLowerCase())%6,t=0;while(own[j]&&t<6){j=(j+1)%6;t++;}if(own[j])continue;own[j]=p;slot.set(p.k,j);}

/* the house layout rides along in presence; Claude rooms cap presence at 4 KiB, so a very full house sends what fits (placed-first items first).

function visReset(){VIS.host=null;VIS.id='';VIS.st='';VIS.hm='';VIS.seenHome=false;VIS.away=0;}
function visTick(dt){if(!VIS.st)return;const now=performance.now(),a=MP.peers.get(VIS.host);

/* ✨ "New in!" shelves: buy one and a brand-new thing pops up in its place, so the shops never run out */
const NEWCOLS=[['#ff8fab','Bubblegum'],['#ff6f61','Coral'],['#ffa45c','Mango'],['#ffe066','Lemon'],['#c5e86c','Lime'],['#6ee7b7','Mint'],['#4dd4c6','Teal'],['#7dd3fc','Sky'],['#3b82f6','Ocean'],['#a78bfa','Grape'],['#e9b8ff','Lilac'],['#f0abfc','Orchid'],
  ['#ffc4a8','Peach'],['#fde68a','Butter'],['#9ff0d0','Seafoam'],['#e8ecf3','Cloud'],['#334155','Midnight'],['#c2843a','Caramel'],['#ff3d9a','Hot pink'],['#8b5cf6','Violet'],['#22c55e','Leaf'],['#ef4444','Cherry'],['#fbbf24','Sunny'],['#94a3b8','Silver']];
const colName=c=>{const f=NEWCOLS.find(x=>x[0]===c);return f?f[1]:'Special';};
const NEWIN_SHOPS={clothes:1,toys:1,flowers:1,pets:1,home:1};let NEWPOP=null;
function niFurnPool(sh){return(sh==='home'?BUY_FURN:(SHOPS[sh]&&SHOPS[sh].furn)||[]).filter(t=>FURN[t]&&FURN[t].cols&&!FURN[t].gold);}
function niMake(sh,avoid){
  for(let k=0;k<80;k++){let it=null;
    if(sh==='clothes'){
      if(Math.random()<.75){const key=pick(Object.keys(CLOTHES).filter(x=>CLOTHES[x].hat||CLOTHES[x].gl)),C=CLOTHES[key],c=pick(NEWCOLS.map(x=>x[0]).concat(C.cols));
        if(!variants(key).some(v=>v.c===c))it={kind:'hat',k:key,c,n:colName(c)+' '+C.n.toLowerCase(),i:C.i,p:C.p};}
      else{const sl=pick(['top','bottom','shoes']),c=pick(NEWCOLS)[0];if(!lookOpts(sl).includes(c))it={kind:'col',k:sl,c,n:colName(c)+' '+{top:'sweater',bottom:'pants',shoes:'shoes'}[sl],i:{top:'👚',bottom:'👖',shoes:'👟'}[sl],p:{top:10,bottom:8,shoes:6}[sl]};}}
    else{const pool=niFurnPool(sh);if(!pool.length)return null;const t=pick(pool),F=FURN[t],c=pick(NEWCOLS)[0];if(!F.cols.includes(c))it={kind:'furn',k:t,c,n:colName(c)+' '+F.n.toLowerCase(),i:F.i,p:F.p};}
    if(it&&!(avoid||[]).some(a=>a&&a.k===it.k&&a.c===it.c))return it;}
  return null;}
function newIn(sh){S.newin=S.newin||{};let L=S.newin[sh];if(!Array.isArray(L))L=S.newin[sh]=[];
  for(let i=0;i<3;i++){const it=L[i];if(!it||(it.kind==='hat'&&variants(it.k).some(v=>v.c===it.c))||(it.kind==='col'&&lookOpts(it.k).includes(it.c))||(it.kind==='furn'&&!FURN[it.k]))L[i]=niMake(sh,L);}
  return L;}
function newInHTML(sh){if(!S||!NEWIN_SHOPS[sh])return'';const L=newIn(sh);if(!L.some(Boolean))return'';
  return`<div class="sec">✨ New in! <small class="nisub">Buy one and something new pops up!</small></div><div class="grid newin">${L.map((it,i)=>{if(!it)return'';const img=it.kind==='furn'?thumb(it.k,it.c):'';

const dlMax=()=>dl().more?DLV_DAY*2:DLV_DAY,PZ_PAY=[25,60,100,135,175,210],dlPay=s=>PZ_PAY[clamp(s==null?dlStars():s|0,0,5)];

/* real walking distance along the paths, from the Pizzeria door to a house door */
let RTD=null;
function routeLen(x,z){if(!RTD){const n=WP.length,d=new Array(n).fill(1e9),done=new Array(n).fill(false);
    for(let i=0;i<n;i++)d[i]=Math.hypot(WP[i][0]-PIZZERIA[0],WP[i][1]-PIZZERIA[1])*1.6;
    for(;;){let u=-1,m=1e9;for(let i=0;i<n;i++)if(!done[i]&&d[i]<m){m=d[i];u=i;}if(u<0)break;done[u]=true;
      for(const v of NEIGH[u]){const w=d[u]+Math.hypot(WP[u][0]-WP[v][0],WP[u][1]-WP[v][1]);if(w<d[v])d[v]=w;}}RTD=d;}
  let b=1e9;for(let i=0;i<WP.length;i++)b=Math.min(b,RTD[i]+Math.hypot(WP[i][0]-x,WP[i][1]-z)*1.15);return b;}
const doorLen=H=>routeLen(H.x+Math.sin(H.ry),H.z+Math.cos(H.ry));
/* VIPs are always a rush: about 5 m per second plus a little, so you need to RUN. Flats add time for the stairs. */
function rareLim(H,flat){let t=12+doorLen(H)/5.2;if(flat)t+=12+(Math.floor(flat/10)-1)*8;return Math.max(20,Math.round(t/5)*5);}

function chefTalk(){if(S.job!=='delivery'){chefSay("WELCOME to my kitchen! 🔥 I'm Chef Blaze. The BEST pizza in town — I promise! Hungry?",[['🛒 Buy food','pzshop'],['Bye!','close']]);return;}
  const d=dl(),o=d.o;
  if(o&&o.st==='wait'){pickUp();return;}
  if(o){const W=oWho(o);chefSay(o.r?`What are you doing back here?! ⭐ ${W.nm} is WAITING! Go, go, GO! 🛵`:`Why are you still here?! ${W.nm} is waiting for that ${o.pz} pizza! GO, GO, GO! 🛵`,[['🛵 Yes, Chef!','close']]);return;}
  if(d.fb){const f=d.fb;d.fb=null;change();chefSay(f==='bad'?"A BAD review?! 😱 Come ON! I know you can be faster than that! Next time: run, run, RUN! 🏃":"A FIVE-star review! 🌟 BEAUTIFUL! That's how we do it in MY kitchen!",[['🔥 Yes, Chef!','close']]);return;}
  if(dlAsk()){chefAsk();return;}
  if(d.done>=DLV_DAY*2){chefSay("That's it, see ya!",[['👋 Bye, Chef!','close']]);return;}
  if(d.end==='rest'){chefSay(`You again?! 😄 No more pizzas today: go and CHILL! See you ${pzNext()}!`);return;}
  if(!pizzaOpen()){chefSay(pzShutLine());return;}
  if(!d.on){d.on=true;d.wait=Math.min(d.wait,5);change();}
  chefSay(d.quiet>0?"It's very quiet… 😟 People read that bad review. Wait here — an order will come soon!":"No orders yet! Patience… wait right here, they'll come! 📩");}

  const H=HOUSE(o.h),W=oWho(o);const at=`the ${H.n}${o.flat?', flat '+o.flat:''}`;
  if(o.r)chefSay(`Listen up! ⭐ This ${o.pz} pizza is for ${W.nm}, ${W.t}! ${W.she?'She':'He'} doesn't even LIKE pizza… so you must be FAST. Lightning fast! Take it to ${at}. Your timer starts when you close this. GO!`,[["🔥 Yes, Chef!",'close']]);
  else chefSay(`Here it is! One PERFECT ${o.pz} pizza for ${W.nm}! 🍕 Take it to ${at}. Now go — don't let it get cold!`,[["🛵 Yes, Chef!",'close']]);}

/* a new order comes in */
function newOrder(){const d=dl();let H=pick(HOUSES.filter(h=>h.id!==d.last));const pz=pick(PIZZAS);
  const rare=(S.dlTotal||0)>=2&&!d.lr&&(d.rares||0)<3&&Math.random()<RARE_P;let o,far=false;
  if(rare){const L=HOUSES.filter(h=>h.id!==d.last).sort((a,b)=>doorLen(b)-doorLen(a));far=Math.random()<.6;H=pick(far?L.slice(0,4):L.slice(-4));}
  const flat=isApt(H.id)?(1+Math.floor(Math.random()*3))*10+1+Math.floor(Math.random()*5):0;
  if(rare){let v=Math.floor(Math.random()*VIPS.length);if(v===d.lv)v=(v+1)%VIPS.length;d.lv=v;d.rares=(d.rares||0)+1;const lim=rareLim(H,flat);o={h:H.id,pz,lim,pay:dlPay()+50,st:'wait',left:lim,r:1,v};}
  else{const lim=pick(DLV_TIMES);o={h:H.id,pz,lim,pay:dlPay(),st:'wait',left:lim,w:Math.floor(Math.random()*resList(H.id).length)};}
  if(flat)o.flat=flat;d.o=o;d.lr=rare;d.last=H.id;if(d.quiet>0)d.quiet--;change();
  SFX.ding();if(rare)setTimeout(()=>SFX.rare(),650);try{if(navigator.vibrate)navigator.vibrate(rare?[120,80,120,80,320]:[120,80,120]);}catch(e){}
  const W=oWho(o);

function dsNeat(its){const out=[],tol=.35,W=CLW,D=CLD;

function hwQ(subj){

/* 🧼 kind and safe notes only: no rude words, links, emails, phone numbers or home addresses */
const BD_ROOT=/\b(fuck|shit|bitch|bastard|cunt|dick|pussy|asshole|slut|whore|fag|nigg|retard|wank|twat|bollock|douche|porn|sex|nude|naked|boob|penis|vagina|suicide|stupid|idiot|kurva|nahui|nachui|pizd|bybis|debil|sikn)/,
  BD_WORD=/\b(ass|asses|arse|cock|cocks|prick|tit|tits|piss|crap|damn|dumb|loser|kys|blyat|blet|huj|chuj|die)\b|\bkill (you|yourself|u)\b|\bhate (you|u)\b|\bshut ?up\b/;
function bdBad(s){s=String(s||'');
  if(/@|https?:|www\.|:\/\/|\.(com|net|org|io|co|uk|lt|de|ru|app|ly|gg|tv|xyz|info|biz)\b|\bdot ?com\b/i.test(s))return true;   /* links and emails */
  if(/(\d[\s\-().+\/]*){6,}/.test(s.replace(/\b[1-9]0{2,}\b/g,' ')))return true;   /* phone numbers: long digit runs, also with spaces or dashes ("100000 flowers" is fine) */
  if(/\b\d+[a-z]?\s+((?!(more|big|bigger|new|small|little|long|tiny|giant|huge|cool|fun|nice|extra|other|tennis|basketball|football|soccer|race|racing|wheel|bike|slide|swim|bowling|play|kids?|dogs?|cats?|car|toy|food|lane|of|the|and|for|with|in|on|to|at)\b)[a-zà-ž]+\s+){1,2}(street|road|avenue|lane|drive|boulevard|court|crescent|terrace|highway|blvd|ave)\b|\b(street|road|avenue|boulevard|apt|apartment)\.?\s*(no\.?|nr\.?|#)?\s*\d+\b(?!\s+(the|to|a|an|my|more|and|or|of|for|with)\b)|(gatv[eė]|stra(ss|ß)e)\s*\d+|\b(g|pr|al|str|st|rd)\.\s*\d+|\b(i|we)\s+live\s+(at|on|in)\b|\baddress\b|\blt-?\d{5}\b/i.test(s))return true;   /* home addresses */
  let t=s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[0134578@$!|]/g,c=>({0:'o',1:'i',3:'e',4:'a',5:'s',7:'t',8:'b','@':'a','$':'s','!':'i','|':'i'}[c]));
  t=t.replace(/\b([a-z])[\s.\-_*+]+(?=[a-z]\b)/g,'$1').replace(/\b((hickory )?dickory|dickens|pussycats?|pussy willows?|(blue|great|coal) tits?|tit birds?)\b/g,' ');   /* "f u c k" -> "fuck"; nursery rhymes, books and birds are fine */
  return [t.replace(/([a-z])\1\1+/g,'$1'),t.replace(/([a-z])\1\1+/g,'$1$1')].some(x=>BD_ROOT.test(x)||BD_WORD.test(x));}
const bdHash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);};

ACT.bdh=id=>{const n=BD.notes[id];if(!n||!BD.on)return;if(bdLeft(bdList('new'))<=0){SFX.no();toast('You gave all 3 hearts! Take one back from a note to give it again. 💗',3.6);return;}
  bdHeart(id,Math.min(3,((n.h&&n.h[bdMe()])|0)+1));SFX.pop();};
ACT.bdu=id=>{const n=BD.notes[id];if(!n||!BD.on)return;bdHeart(id,Math.max(0,((n.h&&n.h[bdMe()])|0)-1));};
ACT.bdwrite=()=>{if(!BD.on)return;const me=bdMe(),day=Date.now()-864e5;let k=0;for(const id in BD.notes){const x=BD.notes[id];if(x&&x.p===me&&(+x.at||0)>day)k++;}
  if(k>=3){SFX.no();toast('You pinned 3 ideas today! Come back tomorrow for more. 📌',3.6);return;}
  openPanel(`<div class="hd"><h2>✏️ Write an idea</h2><button class="btn x" data-a="close" aria-label="Close">✕</button></div>
    <p class="note">What would make Cozy Town even cozier? Keep it short and kind. 💛</p>
    <input class="inp" id="bdIn" maxlength="80" placeholder="My idea…" autocomplete="off" enterkeyhint="done" style="margin-top:12px">
    <p class="bdme" id="bdErr" hidden></p>
    <div class="row"><button class="btn mint" data-a="bdpin">📌 Pin it!</button><button class="btn white" data-a="bdback">⬅️ Back</button></div>`,{cls:'bdwr'});
  const i=$('bdIn');i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ACT.bdpin();}});i.focus({preventScroll:true});};
ACT.bdback=()=>bdRender();
ACT.bdpin=()=>{const i=$('bdIn'),er=$('bdErr');if(!i||!BD.on)return;const t=i.value.replace(/[\u0000-\u001f\u007f-\u009f\u2028\u2029]/g,' ').replace(/\s+/g,' ').trim().slice(0,80);
  const no=m=>{SFX.no();er.textContent=m;er.hidden=false;};
  if(t.length<3)return no('Write a little more! ✏️');if(bdBad(t))return no("Let's keep notes friendly and safe 💛");
  const me=bdMe(),id=uid(),n={t,n:(S.name&&!bdBad(S.name)?S.name:'A friend').slice(0,16),at:window.firebase.database.ServerValue.TIMESTAMP,p:me};
  BD.notes[id]=Object.assign({},n,{at:Date.now()});BD.tab='new';SFX.yay();toast('📌 Your idea is on the board! 💛',3);bdRender();$('card').scrollTop=0;change();
  try{BD.ref.child(id).set(n).catch(bdFail);}catch(e){bdFail();}};
/* 🤔 Sundays: Rosie reads the notes and thinks all day about what to build. The most-hearted idea comes up most (about 6 times in 10). Never a promise. */
function bdIdea(){const L=BD.on?bdList('top'):[];if(!L.length)return null;const top=L.length<2||Math.random()<.6;return{top,hh:top&&L[0].h>0,t:(top?L[0]:pick(L.slice(1,10))).t};}   /* hh: it really has hearts */
function bdRosie(f){if(!f||f.d.id!=='rosie'||!S||wdIdx()!==6)return null;const o=bdIdea();if(!o)return null;const t=o.t;
  return o.top?pick((o.hh?[`It's Sunday, my thinking day! 🤔 So many hearts for “${t}”…`,`I read the ideas board today. 📌 “${t}” has the most hearts! Hmm…`]:[`It's Sunday, my thinking day! 🤔 I read “${t}” on the ideas board…`]).concat([`“${t}”… what a cozy idea! I keep thinking about it. 💭`,`Hmm, “${t}”… I wonder where that could go. 🤔`]))
    :pick([`Someone wrote “${t}” on the ideas board. Fun! 😊`,`“${t}”? Hehe, I like that one too! 💭`,`I'm reading every note on the board today. Like “${t}”! 📌`]);}
function bdBubOff(){const b=BD.bub;if(!b)return;BD.bub=null;if(b.parent)b.parent.remove(b);b.material.map.dispose();b.material.dispose();}
function bdTick(dt){const f=FRIEND_ACTORS[0],ok=f&&f.d.id==='rosie'&&f.mode!=='away'&&f.mode!=='talk'&&f.loc===CUR.id&&f.g.visible;
  if(BD.bub){BD.bubT-=dt;if(BD.bubT<=0||!ok)bdBubOff();}
  if((BD.cool-=dt)>0||!ok||!BD.on||wdIdx()!==6||Math.hypot(P.x-f.x,P.z-f.z)>7)return;
  const o=bdIdea();BD.cool=o?24:60;if(!o)return;const s=o.t.length>22?o.t.slice(0,21)+'…':o.t;   /* 💭 a thought bubble when you pass by */
  const b=label(o.top?`💭 “${s}” 🤔`:`💭 “${s}”? Hmm…`,.3);b.position.y=2.4;f.g.add(b);BD.bub=b;BD.bubT=6;}

/* ================= main loop ================= */
function applyGfx(){const nice=SET.gfx!=='fast';renderer.setPixelRatio(Math.min(devicePixelRatio||1,nice?2:1));renderer.shadowMap.enabled=nice;sun.castShadow=nice;
  scene.traverse(o=>{if(o.material){(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true);}});resize();}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;BASEFOV=w<h?80:70;camera.fov=BASEFOV;camera.updateProjectionMatrix();}
let last=performance.now(),saveT=0,titleT=0,hardT=0,navT=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(PLAYING){
    if(!UI.open||true){HOUR=hourLen(S.time);S.time+=dt/HOUR;if(S.time>=24){S.time-=24;S.day++;newDay();change();}
      S.hunger=Math.max(0,S.hunger-dt/HOUR*4);if(S.hunger<20&&!hungryWarn){hungryWarn=true;toast('Your tummy is rumbling! Eat something from your 🎒 bag.',4);}if(S.hunger>30)hungryWarn=false;}
    updatePlayer(dt);
    let fi=0;for(const f of FRIEND_ACTORS)f.update(dt,f.mode==='follow'?fi++:0);PET_ACTORS.forEach((p,i)=>p.update(dt,fi+i+(fi?0:1)));
    if(CUR.id==='pets')updatePen(dt);
    if(CUR.id==='toys'&&CUR.train){const T=CUR.train;T.userData.t=(T.userData.t||0)+dt*.9;T.children.forEach((c,i)=>{const a=T.userData.t-i*.32;c.position.set(Math.cos(a)*.88,0,Math.sin(a)*.55);c.rotation.y=Math.atan2(-Math.sin(a)*.88,Math.cos(a)*.55);});}
    for(const w of WALKERS)w.update(dt);
    updateCars(dt);mpTick(dt);laneTick(dt);zzTick(dt);for(const s of SHOPPERS)s.update(dt);
    updGarden(dt);bdTick(dt);
    {const vis=CUR.id==='city'&&sittersOut();for(const s of SITTERS){s.p.root.visible=vis;if(vis){s.t+=dt;s.p.head.rotation.y=Math.sin(s.t*.5)*.35;if(s.p.wave>0){s.p.wave-=dt;s.p.arms[1].rotation.z=2.5+Math.sin(s.p.wave*14)*.35;}else s.p.arms[1].rotation.z*=.85;}}}
    psUpdate(dt);dayTick();
    for(const k of KEEPERS)if(k.L===CUR){k.p.root.rotation.y=angLerp(k.p.root.rotation.y,Math.atan2(P.x-k.x,P.z-k.z),.05);animPerson(k.p,dt,false);}
    if(CUR&&CUR.id==='studio'&&!CR&&!fading){setLoc('city');P.x=-17;P.z=-4.6;P.yaw=0;P.pitch=0;P.sit=null;P.ride=null;$('hud').hidden=false;camera.clearViewOffset();resize();saveLocal();}
    if(CUT)cutUpdate(dt);if(CLIMB)climbUpdate(dt);floorVis();
    if(CR)crCam(dt);else if(P.ride)updateRide(dt);else updateCamera(dt);if(CUT)cutCam(dt);swingUI();
    if(DECO.on)decoUpdate();
    TARGET=(UI.open||DECO.on||CUT||CLIMB||TUT||DTUT)?null:findTarget();showAction();jobTick(dt);
    hudT+=dt;if(hudT>.5){hudT=0;updHud(false);padSize();}
    saveT+=dt;if(saveT>10){saveT=0;saveLocal();}
    hardT+=dt;if(hardT>1){hardT=0;hardCheck();}
    navT+=dt;if(navT>.15){navT=0;updNav();}if(BEACON&&BEACON.visible&&BEACON.pin)BEACON.pin.position.y=3.4+Math.sin(performance.now()/300)*.25;
    awTick(dt);netTick(dt);
  }else{titleT+=dt*.05;
    if(CUR&&CUR.id==='city'){for(const w of WALKERS)w.update(dt);updateCars(dt);}
    if(!S||!CUR||CUR.id==='city'){const cx=FTN?FTN.fx:0,cz=FTN?FTN.fz:0;camera.position.set(cx+Math.cos(titleT)*30,14,cz+Math.sin(titleT)*30);camera.lookAt(cx,1,cz);}}
  if(CUR&&CUR.type==='out'){const L=LOC.city,tt=now/1000;
    updFountain(dt);updDucks(dt,tt);
    updBall(dt);
    L.swings.forEach((s,i)=>{if(!(P.ride&&P.ride.kind==='swing'&&P.ride.i===i))s.rotation.x=lerp(s.rotation.x,Math.sin(tt*1.3+i*1.7)*.18,.05);});
    for(const c of clouds){c.position.x+=c.userData.sp*dt;if(c.position.x>230)c.position.x=-230;}
    for(const l of LITTER)l.sp.position.y=.45+Math.sin(tt*3+l.k)*.06;}
  updTVs(dt);updFloats(dt);updBeach(dt);
  const tx=Math.round(camera.position.x),tz=Math.round(camera.position.z);sun.target.position.set(tx,0,tz);sun.position.set(tx+SUND.x*70,SUND.y*70,tz+SUND.z*70);
  skyMesh.position.copy(camera.position);stars.position.copy(camera.position);
  updSky();renderer.render(scene,camera);
}
async function boot(){
  capsEarly();
  try{
    const cv=$('c');renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
    renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    {const K=THREE.ShaderChunk,f=K.shadowmap_pars_fragment;if(f.includes('return shadow;'))K.shadowmap_pars_fragment=f.replace('return shadow;','return mix(shadow,1.0,smoothstep(.72,.98,max(abs(shadowCoord.x-.5),abs(shadowCoord.y-.5))*2.));');}   /* 🌳 shadows fade out softly far away instead of popping in */
    initMaterials(renderer.capabilities.isWebGL2);
    scene=new THREE.Scene();FOG=new THREE.Fog('#c4ecff',55,270);scene.fog=FOG;
    camera=new THREE.PerspectiveCamera(70,1,.1,700);camera.rotation.order='YXZ';
    hemi=new THREE.HemisphereLight('#ffffff','#a8c69a',.75);scene.add(hemi);
    sun=new THREE.DirectionalLight('#fff4e0',.9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-30;sc.right=30;sc.top=30;sc.bottom=-30;sc.near=1;sc.far=150;sun.shadow.bias=-.0006;sun.shadow.normalBias=.03;scene.add(sun);scene.add(sun.target);
    lamp=new THREE.PointLight('#ffe2b8',0,20,1.4);scene.add(lamp);
    try{await Promise.race([document.fonts.load('800 40px "Baloo 2"'),new Promise(r=>setTimeout(r,2000))]);}catch(e){}
    buildSky();buildCity();buildHome();buildMarket();buildPetShop();buildFlowerShop();buildCafe();buildClothesShop();buildToyStore();buildBakery();buildIceCream();buildLibrary();buildSchool();buildClassrooms();buildFireStation();buildPizzeria();buildApts();buildClientRoom();buildVisit();buildBeach();buildStudio();buildActors();buildTownfolk();buildPetShow();buildCars();buildBall();buildShoppers();
    S=freshState();setLoc('city');S=null;
    setupInput();applyGfx();addEventListener('resize',resize);
    requestAnimationFrame(t=>{last=t;frame(t);});
    cloudInit();
    const b=$('tPlay');b.disabled=false;b.textContent='Play';b.focus({preventScroll:true});
  }catch(e){console.error(e);const d=document.createElement('div');d.id='err';d.textContent='Oops, the game could not start on this device. ('+(e&&e.message||e)+')';document.body.appendChild(d);}
}
boot();
